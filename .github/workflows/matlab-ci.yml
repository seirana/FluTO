name: MATLAB CI

on:
  push:
    branches: [main, quality-upgrade]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3

      - name: Run solver-independent unit tests
        uses: matlab-actions/run-command@v3
        with:
          command: addpath("src"); results = runtests("tests"); assertSuccess(results)

      - name: Check maintained source parses
        uses: matlab-actions/run-command@v3
        with:
          command: addpath("src"); which fluto.runCondition; which fluto.enumerateTradeoffs; which fluto.buildFullyCoupledMatrix
